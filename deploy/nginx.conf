# Trip Campus website. Installed by setup.sh as /etc/nginx/sites-available/tripcampus
# certbot adds the HTTPS (443) lines to this file automatically.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/tripcampus;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # admin API and enquiry form -> the Trip Campus app
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # photos and fonts have unique names: cache for a long time
    location ~ ^/assets/(img|og|fonts)/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~ ^/assets/(css|js)/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /assets/js/config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /admin/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
